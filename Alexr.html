<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Start</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #0f0f0f;
        overflow: hidden;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .container {
        height: 100vh;
        width: 100vw;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .start-btn {
        width: 280px;
        height: 80px;
        font-size: 28px;
        font-weight: bold;
        cursor: pointer;
        color: white;
        background: linear-gradient(135deg, #00439c 0%, #00a0e9 100%);
        border: none;
        border-radius: 50px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .start-btn:hover {
        transform: scale(1.05);
        box-shadow: 0 6px 20px rgba(0,160,233,0.4);
    }

    .start-btn:active {
        transform: scale(0.98);
    }
</style>
</head>
<body>

<div class="container">
    <button class="start-btn" id="startBtn">Start</button>
</div>

<script>
document.getElementById("startBtn").addEventListener("click", async () => {
    try {
        const response = await fetch(
            "https://cdn.jsdelivr.net/gh/dskjfoisjfsjio/alexrsworld@latest/singlefile.html?t=" + Date.now()
        );

        const html = await response.text();

        const blob = new Blob([html], { type: "text/html" });
        const blobURL = URL.createObjectURL(blob);

        window.open(blobURL, "_blank");
    } catch (err) {
        alert("Failed to load the site.");
        console.error(err);
    }
});
</script>

</body>
</html>
